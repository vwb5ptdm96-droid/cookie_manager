<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Cookie 同步助手</title>
  <style>
    body {
      width: 280px;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      margin: 0;
      padding: 14px;
      background: #fafafa;
      color: #222;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.7;
      margin-bottom: 10px;
    }
    .row { display: flex; justify-content: space-between; }
    .muted { color: #888; }
    .ok { color: #1a7f37; }
    .fail { color: #cf222e; }
    .btn {
      display: block;
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }
    .btn:hover { background: #1d4ed8; }
    .btn.ghost {
      background: #fff;
      color: #2563eb;
      border: 1px solid #2563eb;
    }
    #statusLine { font-size: 12px; color: #666; margin-bottom: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h1>🍪 Cookie 同步助手</h1>

  <div class="card">
    <div class="row"><span class="muted">后端地址</span><span id="backend"></span></div>
    <div class="row"><span class="muted">同步域名</span><span id="domains"></span></div>
    <div class="row"><span class="muted">任务轮询</span><span id="poll"></span></div>
  </div>

  <div class="card" id="lastResultCard" style="display:none">
    <div class="row"><span class="muted">最近同步</span><span id="lastTime"></span></div>
    <div class="row"><span id="lastDetail"></span></div>
  </div>

  <div id="statusLine"></div>
  <button class="btn" id="syncBtn">立即同步</button>
  <button class="btn ghost" id="optionsBtn">打开设置</button>

  <script src="popup.js"></script>
</body>
</html>
