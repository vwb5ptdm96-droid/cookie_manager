<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>触发 Cookie 同步(测试)</title>
  <style>
    body { font-family: "Microsoft YaHei", system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 17px; }
    input { width: 100%; box-sizing: border-box; padding: 7px 10px; margin: 4px 0 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    label { font-size: 13px; font-weight: 600; }
    button { padding: 8px 22px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
    pre { background: #f5f5f5; border-radius: 6px; padding: 10px; font-size: 12px; overflow: auto; }
    .hint { font-size: 12px; color: #888; line-height: 1.7; }
  </style>
</head>
<body>
  <h1>🎯 触发 Cookie 同步(按需测试)</h1>
  <p class="hint">
    这个页面通过 <code>chrome.runtime.sendMessage</code> 通知扩展执行同步,用于验证"外部触发"通道。
    <br />前提:
    <br />① 用本地 HTTP 服务打开本页,如 <code>python -m http.server 8080</code> 后访问
       <code>http://localhost:8080/trigger.html</code> —— 该域名需在扩展 manifest 的
       <code>externally_connectable.matches</code> 白名单内;
    <br />② 在 <code>chrome://extensions</code> 复制本扩展的 ID 填入下面输入框。
  </p>

  <label>扩展 ID</label>
  <input id="extId" placeholder="如 abcd...p" autocomplete="off" />
  <label>要同步的域名(逗号分隔)</label>
  <input id="domains" placeholder="example.com" autocomplete="off" />

  <button id="trigger">发送同步指令</button>
  <pre id="result">等待发送...</pre>

  <script src="trigger.js"></script>
</body>
</html>
