<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Cookie 一键上报</title>
  <style>
    body {
      width: 280px;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      margin: 0;
      padding: 14px;
      background: #fafafa;
      color: #222;
    }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.8;
      margin-bottom: 10px;
    }
    .muted { color: #888; }
    .btn {
      display: block;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>🍪 Cookie 一键上报</h1>
  <div class="card">
    <p class="muted" style="margin:0">
      已加载悬浮球：打开任意已登录页面，点击右下角 <b>🍪</b> 悬浮球即可抓取上报。
      悬浮球可拖动到任意位置。
    </p>
  </div>
  <button class="btn" id="optionsBtn">打开设置</button>
  <script src="popup.js"></script>
</body>
</html>
